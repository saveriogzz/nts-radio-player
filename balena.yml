name: nts-radio-player
type: sw.application
description: >-
  Stream NTS Radio, Spotify Connect, and AirPlay on a Raspberry Pi
  with Pimoroni Pirate Audio. NTS plays on boot; other sources are
  discoverable on the network.
version: "3.1.0"
assets:
  repository:
    type: blob.asset
    data:
      url: "https://github.com/saveriogzz/nts-radio-player"
  logo:
    type: blob.asset
    data:
      url: "https://raw.githubusercontent.com/saveriogzz/nts-radio-player/main/logo.png"
post-provisioning: |
  ## Usage

  Attach a [Pimoroni Pirate Audio](https://shop.pimoroni.com/products/pirate-audio-line-out)
  HAT to the Pi's 40-pin header before powering on. On first boot the device
  downloads the app, then starts playing NTS channel 1 automatically.

  | Button | Playing | Menu |
  |--------|---------|------|
  | A (top-left) | Previous channel/mixtape | Scroll up |
  | B (bottom-left) | Next channel/mixtape | Scroll down |
  | X (top-right) | Play/Pause | Select |
  | Y (bottom-right) | Open menu | Back |

  Defaults can be overridden with the `NTS_DEFAULT_CHANNEL`,
  `NTS_DISPLAY_BRIGHTNESS`, and `NTS_BUTTON_DEBOUNCE_MS` environment
  variables in the dashboard.

  The device also advertises itself as a Spotify Connect and AirPlay
  target. Spotify Connect requires a Soloist API key: add `SOLOIST_API_KEY`
  under Fleet → Variables before adding devices (generate one at
  https://developer.spotify.com/documentation/soloist).
  Disable either source with `DISABLE_SPOTIFY` or `DISABLE_AIRPLAY`.
data:
  defaultDeviceType: "raspberrypi0-2w-64"
  supportedDeviceTypes:
    - "raspberrypi0-2w-64"
    - "raspberry-pi2"
    - "raspberrypi3"
    - "raspberrypi3-64"
    - "raspberrypi4-64"
    - "raspberrypi5"
  applicationConfigVariables:
    - RESIN_HOST_CONFIG_dtparam: '"i2c_arm=on","spi=on","audio=off"'
    - RESIN_HOST_CONFIG_dtoverlay: '"vc4-kms-v3d,cma-320","hifiberry-dac"'
    - RESIN_HOST_CONFIG_gpio: '"25=op,dh"'
  applicationEnvironmentVariables:
    - NTS_DEFAULT_CHANNEL: 1
    - NTS_DISPLAY_BRIGHTNESS: 80
    - NTS_BUTTON_DEBOUNCE_MS: 200
    - VOLUME: 75
    - AUDIO_OUTPUT: DAC
