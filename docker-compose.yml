version: "2.1"

volumes:
  pipewire:
  soloistdata:

services:
  # ── Core ──────────────────────────────────────────────────
  audio:
    build: ./core/audio
    privileged: true
    restart: always
    ports:
      - 4317:4317
    volumes:
      - pipewire:/run/pipewire
    environment:
      - AUDIO_OUTPUT=DAC

  nts-radio:
    build: .
    privileged: true
    restart: always
    network_mode: host
    tmpfs:
      - /tmp
    volumes:
      - pipewire:/run/pipewire
    depends_on:
      - audio
      - router

  # Decides which source owns the speaker (newest wins) and serves a
  # now-playing feed on ws://127.0.0.1:4319
  router:
    build:
      context: .
      dockerfile: core/router/Dockerfile
    restart: always
    network_mode: host
    volumes:
      - pipewire:/run/pipewire
    depends_on:
      - audio

  # ── Plugins ───────────────────────────────────────────────
  spotify:
    build: ./plugins/spotify
    restart: on-failure
    privileged: true
    network_mode: host
    volumes:
      - soloistdata:/var/lib/soloist
      - pipewire:/run/pipewire
    depends_on:
      - audio

  airplay:
    build: ./plugins/airplay
    restart: on-failure
    network_mode: host
    privileged: true
    labels:
      io.balena.features.dbus: 1

